name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      perf:
        description: "Run the ignored performance test (SC-006)"
        type: boolean
        default: false
env:
  # Cargo's built-in git client cannot use the credential set up below.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  # Until Relate's repository is public, building needs read access to it. Add a
  # read-only token for neo4j-labs/cypherlite as the repository secret
  # RELATE_READ_TOKEN. Once Relate is public the secret is not needed.
  RELATE_READ_TOKEN: ${{ secrets.RELATE_READ_TOKEN }}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Let cargo fetch the Relate repository
        if: env.RELATE_READ_TOKEN != ''
        run: git config --global url."https://x-access-token:${RELATE_READ_TOKEN}@github.com/neo4j-labs/".insteadOf "https://github.com/neo4j-labs/"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - run: scripts/check-public-api.sh
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
  perf:
    if: github.event_name == 'workflow_dispatch' && inputs.perf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Let cargo fetch the Relate repository
        if: env.RELATE_READ_TOKEN != ''
        run: git config --global url."https://x-access-token:${RELATE_READ_TOKEN}@github.com/neo4j-labs/".insteadOf "https://github.com/neo4j-labs/"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
      - run: cargo test --release --test perf -- --ignored
