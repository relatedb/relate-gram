[package]
name = "gramsyn"
version = "0.0.0"
edition = "2021"
description = "SPIKE-007: a typed, position-carrying syntax layer over tree-sitter-gram with gram-value values"

[dependencies]
gram-value = "0.2"
tree-sitter = "0.25"
tree-sitter-gram = "=0.7.0"

[dev-dependencies]
# Only to reuse relate-gram's Relate profile for known tags (`typed::Tag::validate`) in the policy test.
relate-gram = { path = "../../../.." }
