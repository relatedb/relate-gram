[package]
name = "relate-gram"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
description = "Load gram files into Relate, export Relate databases as gram, and fix files the strict loader rejects"
license = "Apache-2.0"
authors = ["The Relate Authors"]
repository = "https://github.com/relatedb/relate-gram"
homepage = "https://github.com/relatedb/relate-gram"
readme = "README.md"
keywords = ["gram", "graph", "cypher", "relate", "import"]
categories = ["command-line-utilities", "database", "parser-implementations"]
exclude = ["/external", "/specs", "/design", "/tests", "/scripts", "/benches", "/.github", "/site", "/.specify", "/.agents", "/.claude", "/CLAUDE.md", "/.gitmodules", "/RELEASING.md", "/CONTRIBUTING.md"]

[lib]
name = "relate_gram"

[dependencies]
# Relate 1.0.x, the first public release. The parquet snapshot codec is not used here.
relate = { version = "~1.0", default-features = false }
tree-sitter = "0.25"
tree-sitter-gram = "=0.7.0"
thiserror = "2"

[dev-dependencies]
proptest = "1"
toml = "0.8"
serde = { version = "1", features = ["derive"] }

[[bench]]
name = "load_export"
harness = false
